# SonarQube scanner config (sonarqube module starter — edit for your project).
# harness/tools/sonar-review.sh reads sonar.projectKey from here; any key you
# define in this file overrides the tool's automatic values (exclusions,
# coverage paths, Java bytecode).
sonar.projectKey=
sonar.projectName=
sonar.sourceEncoding=UTF-8

# Sources/exclusions when the defaults do not fit (the tool injects standard
# build-output exclusions only when sonar.exclusions is not set here):
# sonar.sources=src
# sonar.tests=tests
# sonar.exclusions=**/generated/**,**/migrations/**
